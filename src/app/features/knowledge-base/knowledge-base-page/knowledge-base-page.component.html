<div class="reveal">
  <div class="kb-intro">
    <h2 class="serif kb-intro__title">Your organizational memory</h2>
    <div class="kb-intro__search">
      <app-icon name="search" size="20" />
      <span>Search meetings, documents, MOMs, decisions…</span>
    </div>
  </div>

  <div class="kb-categories">
    @for (category of categories(); track category.label) {
      <app-kb-category-card [category]="category" />
    }
  </div>

  <h3 class="kb-recent-title">Recently added</h3>
  <div class="kb-recent-list">
    @for (item of recentlyAdded(); track item.title) {
      <a [routerLink]="['/app/meetings', slugify(item.title)]" class="kb-recent-row">
        <span class="kb-recent-row__icon"><app-icon name="file-text" size="16" /></span>
        <div class="kb-recent-row__body">
          <div class="kb-recent-row__title">{{ item.title }} — MOM</div>
          <div class="kb-recent-row__meta">{{ item.type }} · {{ item.date }}</div>
        </div>
        <span class="kb-recent-row__chevron"><app-icon name="chevron-right" size="16" /></span>
      </a>
    }
  </div>
</div>
