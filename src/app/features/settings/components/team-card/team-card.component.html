<div class="team-card">
  <div class="team-card__head">
    <h3 class="team-card__name">{{ team().name }}</h3>
    <app-chip variant="action-count">{{ team().members }} members</app-chip>
  </div>
  <div class="team-card__avatars">
    <span class="team-card__avatar team-card__avatar--accent">MK</span>
    <span class="team-card__avatar">PN</span>
    <span class="team-card__avatar">SL</span>
    <span class="team-card__avatar team-card__avatar--overflow">+{{ team().members }}</span>
  </div>
  <div class="team-card__footer">
    <div>
      <div class="mono num team-card__stat-value">{{ team().meetings }}</div>
      <div class="eyebrow">Meetings</div>
    </div>
    <div class="team-card__lead">
      <div class="team-card__lead-name">{{ team().lead }}</div>
      <div class="eyebrow">Team lead</div>
    </div>
  </div>
</div>
