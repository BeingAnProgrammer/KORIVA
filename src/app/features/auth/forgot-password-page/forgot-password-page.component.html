<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="auth-card__brand" aria-label="KORIVA home">
      <app-logo-mark [size]="24" />
      <span class="serif">KORIVA</span>
    </a>

    @if (sentTo(); as email) {
      <h1 class="serif auth-card__title">Check your email</h1>
      <p class="auth-card__subtitle">
        If an account exists for {{ email }}, we've sent a link to reset your password.
      </p>
    } @else {
      <h1 class="serif auth-card__title">Reset your password</h1>
      <p class="auth-card__subtitle">Enter your email and we'll send you a reset link.</p>

      @if (errorMessage(); as message) {
        <p class="auth-card__error" role="alert">{{ message }}</p>
      }

      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label class="auth-field">
          <span class="auth-field__label">Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
          @if (fieldError(); as err) {
            <span class="auth-field__hint">{{ err }}</span>
          }
        </label>

        <button type="submit" class="auth-submit-btn" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>
    }

    <a routerLink="/login" class="auth-card__back">
      <app-icon name="arrow-left" size="16" />
      Back to login
    </a>
  </div>
</div>
