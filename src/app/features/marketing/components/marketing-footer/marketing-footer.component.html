<footer class="site-footer">
  <div class="site-footer__grid">
    <div class="site-footer__brand">
      <div class="site-footer__brand-row">
        <app-logo-mark [size]="28" [showDot]="false" />
        <span class="serif site-footer__brand-name">KORIVA</span>
      </div>
      <p class="site-footer__blurb">Meeting intelligence for teams that decide fast.</p>
      <p class="mono site-footer__tagline">Knowledge · Reasoning · Intelligence · Voice · Analytics</p>
    </div>

    <div class="site-footer__col">
      <div class="eyebrow site-footer__heading">Product</div>
      <div class="site-footer__links">
        <a href="#features" class="site-footer__link">Features</a>
        <a href="#types" class="site-footer__link">Meeting types</a>
        <a href="#ai" class="site-footer__link">AI assistant</a>
      </div>
    </div>

    <div class="site-footer__col">
      <div class="eyebrow site-footer__heading">Company</div>
      <div class="site-footer__links">
        <a href="#" class="site-footer__link">About</a>
        <a href="#" class="site-footer__link">Security</a>
        <a href="#" class="site-footer__link">Contact</a>
      </div>
    </div>

    <div class="site-footer__col">
      <div class="eyebrow site-footer__heading">Appearance</div>
      <app-segmented-control
        [options]="themeOptions"
        [value]="themeService.theme()"
        (valueChange)="themeService.setTheme($event)"
      />
    </div>
  </div>

  <div class="site-footer__bottom">
    <span class="mono site-footer__copyright">© 2026 KORIVA</span>
    <span class="mono site-footer__tagline-bottom">Built for teams that decide fast</span>
  </div>
</footer>
