<section class="hero-lamp">
  <div class="hero-lamp__stage">
    <div class="hero-lamp__beam hero-lamp__beam--left">
      <div class="hero-lamp__beam-mask hero-lamp__beam-mask--left-bottom"></div>
      <div class="hero-lamp__beam-mask hero-lamp__beam-mask--left-edge"></div>
    </div>
    <div class="hero-lamp__beam hero-lamp__beam--right">
      <div class="hero-lamp__beam-mask hero-lamp__beam-mask--right-edge"></div>
      <div class="hero-lamp__beam-mask hero-lamp__beam-mask--right-bottom"></div>
    </div>
    <div class="hero-lamp__haze"></div>
    <div class="hero-lamp__haze-blur"></div>
    <div class="hero-lamp__glow"></div>
    <div class="hero-lamp__bar"></div>
    <div class="hero-lamp__line"></div>
    <div class="hero-lamp__top-mask"></div>

  <div class="hero-lamp__content">

      <span class="hero-lamp__badge-dot"></span>

    </p>

      <a routerLink="/app/dashboard" appButton variant="primary-lg">
        Get started
        <app-icon name="arrow-right" size="18" />
      </a>
      <button type="button" appButton variant="secondary-lg">
        <app-icon name="play" size="17" color="var(--accent)" />

      </button>
