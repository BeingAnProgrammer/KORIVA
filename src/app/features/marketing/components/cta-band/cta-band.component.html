<section class="cta-cinematic">
  <div class="cta-cinematic__pin">
    <div class="cta-cinematic__grid" aria-hidden="true"></div>
    <div class="cta-cinematic__aurora" aria-hidden="true"></div>
    <div class="cta-cinematic__giant-text" aria-hidden="true">KORIVA</div>

    <div class="cta-cinematic__marquee" aria-hidden="true">
      <app-marquee [items]="marqueeItems" [speed]="32" [edgeFade]="true">
        <ng-template let-item>
          <div class="cta-cinematic__marquee-item">
            <span>{{ item }}</span>
            <span class="cta-cinematic__marquee-dot">✦</span>
          </div>
        </ng-template>
      </app-marquee>
    </div>

    <div class="cta-cinematic__content" appScrollReveal>
      <h2 class="serif cta-cinematic__title">Schedule your first<br />meeting in minutes</h2>
      <p class="cta-cinematic__subtitle">Connect your calendar, let the bot do the rest, and never write minutes by hand again.</p>
      <div class="cta-cinematic__actions">
        <a routerLink="/app/dashboard" appMagnetic class="cta-cinematic__btn cta-cinematic__btn--primary">
          Get started
          <app-icon name="arrow-right" size="18" />
        </a>
        <a routerLink="/app/dashboard" appMagnetic class="cta-cinematic__btn cta-cinematic__btn--glass">
          <app-icon name="calendar-plus" size="18" />
          Schedule your first meeting
        </a>
      </div>
    </div>

    <div class="cta-cinematic__bottom">
      <span class="mono cta-cinematic__copyright">© 2026 KORIVA</span>
      <span class="mono cta-cinematic__tagline">Built for teams that decide fast</span>
      <button type="button" appMagnetic class="cta-cinematic__top-btn" (click)="scrollToTop()" aria-label="Back to top">
        <app-icon name="arrow-up" size="18" />
      </button>
    </div>
  </div>
</section>
