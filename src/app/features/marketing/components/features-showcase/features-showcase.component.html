<section id="platform" class="features-showcase" [appJourneyStage]="4">
  <div class="features-showcase__inner">
    <div class="features-showcase__intro" appScrollReveal>
      <app-section-eyebrow>Platform</app-section-eyebrow>
      <h2 class="serif features-showcase__title">Everything from calendar to knowledge base</h2>
      <p class="features-showcase__subtitle">
        The full lifecycle of a meeting — captured, understood, and made useful long after the call ends.
      </p>
    </div>

    <div class="features-showcase__bento" appStaggerReveal>
      @for (feature of features(); track feature.title; let i = $index) {
        <div
          class="features-showcase__tile"
          [class.features-showcase__tile--spotlight]="isSpotlight(i)"
          [style.grid-area]="areaFor(i)"
          [style.--feature-color]="feature.color"
          [appTilt]="isSpotlight(i) ? 5 : 3"
        >
          @if (isSpotlight(i)) {
            <div class="features-showcase__tile-dot-grid" aria-hidden="true"></div>
          }
          <span class="features-showcase__tile-icon">
            <app-icon [name]="feature.icon" [size]="isSpotlight(i) ? 28 : 20" />
          </span>
          <h3 class="features-showcase__tile-title">{{ feature.title }}</h3>
          <p class="features-showcase__tile-desc">{{ feature.desc }}</p>
        </div>
      }
    </div>
  </div>
</section>
