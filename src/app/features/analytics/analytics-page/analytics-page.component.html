<div class="analytics-hero">
  <div class="analytics-hero__wrap">
    <div class="eyebrow">Analytics · last 6 months</div>
    <h1 class="analytics-hero__title">Show me the evidence.</h1>
    <div class="analytics-hero__tabs">
      <app-segmented-control [options]="tabOptions()" [value]="activeKey()" (valueChange)="activeKey.set($event)" />
    </div>
  </div>
</div>

@if (activeTab(); as tab) {
  <div class="analytics-body">
    <div class="analytics-body__wrap">
      <div class="analytics-stats">
        @for (stat of tab.stats; track stat.label) {
          <div class="analytics-stat">
            <div class="mono analytics-stat__label">{{ stat.label }}</div>
            <div class="analytics-stat__value">{{ stat.value }}</div>
            <div class="analytics-stat__delta">{{ stat.delta }}</div>
          </div>
        }
      </div>

      <div class="analytics-card">
        <div class="analytics-card__heading">
          <h2 class="analytics-card__title">{{ tab.chartTitle }}</h2>
          <span class="mono analytics-card__range">MAR — AUG 2026</span>
        </div>
        <app-bar-chart [bars]="chartBars()" />
      </div>

      <div class="analytics-card">
        <h2 class="analytics-card__title analytics-card__title--split">Where time goes</h2>
        <app-percentage-bar-list [items]="tab.split" />
      </div>
    </div>
  </div>
}
