<div class="commitment-row">
  <button
    type="button"
    class="commitment-row__check"
    [attr.aria-pressed]="commitment().done"
    (click)="toggled.emit()"
    aria-label="Mark done"
  >
    <app-icon name="check" size="13" />
  </button>

  <span class="commitment-row__copy">
    <span class="commitment-row__text" [class.commitment-row__text--done]="commitment().done">{{ commitment().task }}</span>
    @if (commitment().quote) {
      <span class="commitment-row__quote">{{ commitment().quote }}</span>
    }
  </span>

  <span class="commitment-row__owner">
    <span class="commitment-row__owner-name">{{ commitment().owner }}</span>
    <button type="button" class="commitment-row__from" (click)="meetingClicked.emit()">from {{ commitment().meeting }} →</button>
  </span>

  <span class="commitment-row__status">
    <app-status-pill [variant]="commitment().statusVariant">{{ commitment().due }}</app-status-pill>
    @if (!commitment().done) {
      <button type="button" appButton variant="ref-ghost-sm" (click)="nudged.emit()">Nudge</button>
    }
  </span>
</div>
