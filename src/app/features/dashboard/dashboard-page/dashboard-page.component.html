<div class="reveal">
  <div class="dashboard-header">
    <div>
      <div class="eyebrow dashboard-header__date">Tuesday, October 15</div>
      <h2 class="serif dashboard-header__greeting">Good morning, Ava</h2>
    </div>
    <app-segmented-control [options]="layoutOptions" [value]="layout()" (valueChange)="layout.set($event)" />
  </div>

  @if (layout() === 'command-center') {
    <app-command-center />
  } @else {
    <app-daily-focus />
  }
</div>
