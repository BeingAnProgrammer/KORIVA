<div class="activity-card">
  <h3 class="activity-card__title">Team activity</h3>
  <div class="activity-card__list">
    @for (item of activity(); track item.who + item.when) {
      <div class="activity-card__row">
        <span class="activity-card__initials">{{ item.initials }}</span>
        <div class="activity-card__text">
          <strong class="activity-card__who">{{ item.who }}</strong>
          {{ item.what }}
          <span class="activity-card__when">· {{ item.when }}</span>
        </div>
      </div>
    }
  </div>
</div>
