<div class="timeline-card">
  <div class="timeline-card__head">
    <h3 class="timeline-card__title">Today &amp; tomorrow</h3>
  </div>
  <div class="timeline-card__body">
    @for (meeting of meetings(); track meeting.title; let last = $last) {
      <div class="timeline-row">
        <div class="timeline-row__rail">
          <span class="timeline-row__dot"></span>
          @if (!last) {
            <span class="timeline-row__line"></span>
          }
        </div>
        <div class="timeline-row__body">
          <div class="timeline-row__head">
            <span class="timeline-row__title">{{ meeting.title }}</span>
            <app-status-pill [variant]="meeting.statusVariant">{{ meeting.status }}</app-status-pill>
          </div>
          <div class="mono timeline-row__meta">{{ meeting.date }} {{ meeting.time }} · {{ meeting.platform }} · {{ meeting.type }}</div>
        </div>
      </div>
    }
  </div>
</div>
