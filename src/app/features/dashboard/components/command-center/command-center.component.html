<div class="command-center__kpis">
  @for (kpi of kpis(); track kpi.label) {
    <app-kpi-card [kpi]="kpi" />
  }
</div>

<app-intelligence-feed-card [signals]="intelligenceFeed()" />

<div class="command-center__columns">
  <div class="command-center__col">
    <app-recent-meetings-card [meetings]="recentMeetings()" />
    <app-needs-attention-card [items]="needsAttention()" />
  </div>

  <div class="command-center__col">
    <app-upcoming-list-card [meetings]="upcomingMeetings()" />
    <app-ai-insights-card [insights]="insights()" />
  </div>
</div>
