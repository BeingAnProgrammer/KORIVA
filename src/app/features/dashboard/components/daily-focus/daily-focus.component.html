<div class="daily-focus">
  <div class="daily-focus__hero-row">
    <app-next-up-card />
    <app-ai-insights-card [insights]="insights()" title="What to know before" [itemIconSize]="14" />
  </div>

  <div class="daily-focus__kpi-row">
    @for (kpi of kpis(); track kpi.label) {
      <app-kpi-compact-tile [kpi]="kpi" />
    }
  </div>

  <div class="daily-focus__columns">
    <app-today-tomorrow-timeline [meetings]="upcomingMeetings()" />
    <app-team-activity-card [activity]="teamActivity()" />
  </div>
</div>
