<div class="reveal">
  <app-meeting-detail-header />
  <app-meeting-tabs-strip [meetingId]="id()" [activeTab]="activeTab()" />

  @switch (activeTab()) {
    @case ('overview') {
      <app-overview-tab />
    }
    @case ('transcript') {
      <app-transcript-tab [meetingId]="id()" />
    }
    @case ('mom') {
      <app-mom-tab />
    }
    @case ('recording') {
      <app-recording-tab />
    }
    @case ('analytics') {
      <app-meeting-analytics-tab />
    }
    @case ('actions') {
      <app-meeting-actions-tab />
    }
    @case ('ai') {
      <app-meeting-ai-tab />
    }
  }
</div>
