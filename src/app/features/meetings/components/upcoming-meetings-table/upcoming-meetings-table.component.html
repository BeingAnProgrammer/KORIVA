<div class="um-table">
  <div class="um-table__row um-table__row--head">
    <span class="eyebrow">Meeting</span>
    <span class="eyebrow">Type</span>
    <span class="eyebrow">Date &amp; time</span>
    <span class="eyebrow">Platform</span>
    <span class="eyebrow">People</span>
    <span class="eyebrow">Status</span>
  </div>
  @for (meeting of meetings(); track meeting.title) {
    <a [routerLink]="['/app/meetings', slugify(meeting.title)]" class="um-table__row">
      <span class="um-table__title">{{ meeting.title }}</span>
      <span class="um-table__type">{{ meeting.type }}</span>
      <span class="num um-table__datetime">{{ meeting.date }}, {{ meeting.time }}</span>
      <span class="um-table__platform">{{ meeting.platform }}</span>
      <span class="num um-table__people">{{ meeting.people }}</span>
      <app-status-pill [variant]="meeting.statusVariant">{{ meeting.status }}</app-status-pill>
    </a>
  }
</div>
