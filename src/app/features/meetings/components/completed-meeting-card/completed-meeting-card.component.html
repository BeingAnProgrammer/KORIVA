<a [routerLink]="['/app/meetings', slugify(meeting().title)]" class="completed-card">
  <div class="completed-card__head">
    <span class="completed-card__title">{{ meeting().title }}</span>
    <span class="mono completed-card__date">{{ meeting().date }}</span>
  </div>
  <p class="completed-card__summary">{{ meeting().summary }}</p>
  <div class="completed-card__chips">
    <app-chip variant="recording"><app-icon name="play-circle" size="13" />Recording</app-chip>
    <app-chip variant="recording"><app-icon name="file-text" size="13" />MOM ready</app-chip>
    <app-chip variant="recording"><app-icon name="clock" size="13" />{{ meeting().duration }}</app-chip>
    <app-chip variant="action-count">{{ meeting().actionsCount }} action items</app-chip>
  </div>
</a>
