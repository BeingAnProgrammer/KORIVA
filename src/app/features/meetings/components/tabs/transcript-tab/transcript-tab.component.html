<div class="transcript-tab">
  <div class="transcript-tab__search">
    <app-icon name="search" size="16" />
    <span>Search transcript</span>
  </div>
  <div class="transcript-tab__body">
    @for (line of lines(); track line.timestamp) {
      <div class="transcript-line">
        <span class="transcript-line__initials">{{ line.initials }}</span>
        <div class="transcript-line__content">
          <div class="transcript-line__head">
            <span class="transcript-line__speaker">{{ line.speaker }}</span>
            <span class="mono transcript-line__time">{{ line.timestamp }}</span>
          </div>
          <p class="transcript-line__text">{{ line.line }}</p>
        </div>
      </div>
    }
  </div>
</div>
