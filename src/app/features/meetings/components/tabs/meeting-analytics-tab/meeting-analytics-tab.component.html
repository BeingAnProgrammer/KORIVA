<div class="meeting-analytics">
  <div class="meeting-analytics__card">
    <h3 class="meeting-analytics__title">Talk time</h3>
    <app-percentage-bar-list [items]="talkTime" />
  </div>
  <div class="meeting-analytics__card">
    <h3 class="meeting-analytics__title">Meeting signals</h3>
    <div class="meeting-signals">
      @for (signal of signals; track signal.label) {
        <div>
          <div class="serif num meeting-signals__value" [style.color]="signal.color ?? 'var(--ink)'">{{ signal.value }}</div>
          <div class="eyebrow">{{ signal.label }}</div>
        </div>
      }
    </div>
  </div>
</div>
