<button type="button" class="template-card">
  <span class="template-card__icon"><app-icon [name]="template().icon" size="20" /></span>
  <div class="template-card__name">{{ template().name }}</div>
  <p class="template-card__desc">{{ template().description }}</p>
  <span class="mono template-card__usage">{{ template().usageLabel }}</span>
</button>
