<div
  class="chat-bubble"
  [class.chat-bubble--user]="!isAi()"
  [class.chat-bubble--ai]="isAi()"
  [style.max-width]="resolvedMaxWidth()"
>
  @if (isAi()) {
    <div class="chat-bubble__ai-header">
      <app-logo-mark [size]="14" />
      KORIVA
    </div>
  }
  @if (typing()) {
    <div class="chat-bubble__typing" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  } @else {
    <div class="chat-bubble__content">
      <ng-content />
    </div>
  }
</div>
