<div class="ai-table">
  <div class="ai-table__row ai-table__row--head" [style.grid-template-columns]="gridTemplateColumns()">
    <span class="eyebrow">Task</span>
    <span class="eyebrow">Owner</span>
    @if (showDue()) {
      <span class="eyebrow">Due</span>
    }
    @if (showMeeting()) {
      <span class="eyebrow">Meeting</span>
    }
    <span class="eyebrow">Status</span>
  </div>

  @for (item of items(); track item.task) {
    <div class="ai-table__row" [style.grid-template-columns]="gridTemplateColumns()">
      <span class="ai-table__task">
        @if (showCheckbox()) {
          <span class="ai-table__checkbox"></span>
        }
        <span class="ai-table__task-text">{{ item.task }}</span>
      </span>
      <span class="ai-table__owner">
        <app-avatar [initials]="item.ownerInitials" [size]="26" />
        <span class="ai-table__owner-name">{{ item.owner }}</span>
      </span>
      @if (showDue()) {
        <span class="num ai-table__due">{{ item.due }}</span>
      }
      @if (showMeeting()) {
        <span class="ai-table__meeting">{{ item.meeting }}</span>
      }
      <app-status-pill [variant]="item.statusVariant">{{ item.status }}</app-status-pill>
    </div>
  }
</div>
