<div class="pct-bar-list">
  @for (item of items(); track item.label) {
    <div class="pct-bar">
      <div class="pct-bar__head">
        <span class="pct-bar__label">{{ item.label }}</span>
        <span class="mono pct-bar__value">{{ item.percent }}%</span>
      </div>
      <div class="pct-bar__track">
        <div class="pct-bar__fill" [style.width.%]="item.percent"></div>
      </div>
    </div>
  }
</div>
