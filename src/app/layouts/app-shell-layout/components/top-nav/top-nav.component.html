<header class="top-nav">
  <div class="top-nav__bar">
    <div class="top-nav__brand">
      <a routerLink="/app/home" class="top-nav__logo-link" aria-label="Home">
        <app-logo-mark [size]="30" />
      </a>
      <b class="top-nav__wordmark">Koriva</b>
    </div>

    <nav class="top-nav__links">
      @for (item of navItems; track item.key) {
        <a [routerLink]="item.route" routerLinkActive="top-nav__link--active" class="top-nav__link">{{ item.label }}</a>
      }
    </nav>

    <div class="top-nav__right">
      <button type="button" appButton variant="accent-sm" class="top-nav__invite" (click)="inviteKoriva()">
        <app-icon name="calendar-plus" size="15" />
        <span class="top-nav__invite-label">Invite Koriva to a meeting</span>
      </button>

      <app-icon-button [icon]="theme.themeIcon()" ariaLabel="Toggle theme" (pressed)="theme.cycleTheme()" />

      <button type="button" class="top-nav__search" (click)="palette.open()">
        <app-icon name="search" size="16" />
        <span class="mono top-nav__search-kbd">⌘K</span>
      </button>

      <div class="top-nav__user">
        <button type="button" class="top-nav__avatar" (click)="toggleUserMenu()" aria-label="Account menu">
          <app-avatar [initials]="userInitials()" [size]="32" />
        </button>

        @if (userMenuOpen()) {
          <button type="button" class="top-nav__menu-backdrop" (click)="closeUserMenu()" aria-label="Close menu"></button>
          <div class="top-nav__menu">
            <div class="top-nav__menu-name">{{ userName() }}</div>
            <div class="top-nav__menu-email">{{ userEmail() }}</div>
            <a routerLink="/app/settings" class="top-nav__menu-item" (click)="closeUserMenu()">Settings</a>
            <button type="button" class="top-nav__menu-item" (click)="signOut()">Log out</button>
          </div>
        }
      </div>

      <button type="button" class="top-nav__mobile-toggle" (click)="toggleMobileNav()" aria-label="Menu">
        <app-icon name="menu" size="18" />
      </button>
    </div>
  </div>

  @if (mobileNavOpen()) {
    <nav class="top-nav__mobile-links">
      @for (item of navItems; track item.key) {
        <a [routerLink]="item.route" routerLinkActive="top-nav__mobile-link--active" class="top-nav__mobile-link" (click)="closeMobileNav()">
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>
