<header class="top-header">
  <div class="top-header__left">
    <span class="top-header__mobile-menu">
      <app-icon-button icon="panel-left-open" ariaLabel="Open navigation" (pressed)="sidebar.toggleMobile()" />
    </span>
    @if (sidebar.collapsed()) {
      <app-icon-button icon="panel-left-open" ariaLabel="Expand sidebar" class="top-header__desktop-expand" (pressed)="sidebar.expand()" />
    }
    @if (backLink(); as back) {
      <a [routerLink]="back.route" class="top-header__back">
        <app-icon name="arrow-left" size="16" />
        {{ back.label }}
      </a>
    }
    <h1 class="serif top-header__title">{{ title() }}</h1>
  </div>

  <div class="top-header__right">
    <div class="top-header__search" role="search">
      <app-icon name="search" size="16" />
      <span class="top-header__search-label">Search everything</span>
      <span class="mono top-header__search-kbd">/</span>
    </div>
    <app-icon-button [icon]="theme.themeIcon()" ariaLabel="Toggle theme" (pressed)="theme.cycleTheme()" />
    <app-icon-button icon="bell" ariaLabel="Notifications" [badge]="true" />
    <button type="button" class="top-header__new-meeting">
      <app-icon name="plus" size="18" />
      <span>New meeting</span>
    </button>
  </div>
</header>
